# Managed by the panel. Generic per-application request-rate filter.
#
# Matches every request line from a given address, regardless of what it
# was for — this jail's whole job is "this one IP is making far more
# requests than a real visitor would in this window", not "this request
# looks malicious". A combined access log line (nginx and Apache's
# `combined` format both start this way) always begins with the client
# address, so this needs nothing more specific than that.
#
# Not tested against a real fail2ban install in this environment — verify
# with `fail2ban-regex` against a real access log sample before relying on
# it in production.

[Definition]
failregex = ^<HOST> -
ignoreregex =
