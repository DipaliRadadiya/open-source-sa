# Managed by the panel. WordPress login brute-force filter.
#
# The same "rate the attempt, not the outcome" approach published fail2ban
# configs for WordPress (commonly distributed as "wordpress-hard") already
# use: WordPress answers every wp-login.php POST with 200 whether the
# password was right or wrong, so a generic access log gives no reliable
# way to tell success from failure. Rate-limiting requests to the fixed,
# well-known login endpoints is the standard mitigation instead — a real
# user fails a password a handful of times; a brute-force script fails it
# hundreds.
#
# Not tested against a real fail2ban install in this environment — verify
# with `fail2ban-regex` against a real access log sample before relying on
# it in production.

[Definition]
failregex = ^<HOST> -.*"POST /wp-login\.php
            ^<HOST> -.*"POST /xmlrpc\.php
ignoreregex =
