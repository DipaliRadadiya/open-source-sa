# Managed by the panel. WordPress login brute-force filter.
#
# Counts failed logins only. WordPress answers a wrong password with 200 and
# a right one with a 302 redirect (measured 2026-10-02), so a successful
# login is not an attempt to ban (bug #93). XML-RPC answers 200 either way,
# so every XML-RPC POST counts — the same rule v7 uses.

[Definition]
failregex = ^<HOST> -.*"POST /wp-login\.php[^"]*" 200\b
            ^<HOST> -.*"POST /xmlrpc\.php[^"]*" 200\b
ignoreregex =
