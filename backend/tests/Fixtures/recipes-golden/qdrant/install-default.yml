name: sv-app-4242

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:6333"

    environment:
      QDRANT__SERVICE__API_KEY: "c6bd82bd3f44fb8f7eabeebfdffe93f3"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"

    volumes:
      - sv-app-4242_data:/qdrant/storage

volumes:
  sv-app-4242_data:
    external: true
