name: sv-app-4242

services:
  yourls:
    image: yourls:1.10.6-apache
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    environment:
      YOURLS_SITE: "https://yourls.golden.test"
      YOURLS_USER: admin
      YOURLS_PASS: "c686909f4fee642c1db008022cd2709b"
      YOURLS_COOKIEKEY: "251150e505fc491469f8419a3c556b05"
      YOURLS_DB_HOST: db
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: "eeccaebb1f2dd5a52b177982df271fd3"
      YOURLS_DB_NAME: yourls

    volumes:
      - sv-app-4242_user:/var/www/html/user
      - /home/owner/site/public_html/docker-entrypoint-init.d:/docker-entrypoint-init.d:ro

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_DATABASE: yourls
      MYSQL_USER: yourls
      MYSQL_PASSWORD: "eeccaebb1f2dd5a52b177982df271fd3"
      MYSQL_ROOT_PASSWORD: "b971b822f6448254a6e78b17fb5916b7"

    volumes:
      - sv-app-4242_db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  sv-app-4242_user:
    external: true
  sv-app-4242_db:
    external: true
