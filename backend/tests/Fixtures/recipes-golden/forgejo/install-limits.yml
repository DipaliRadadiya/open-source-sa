name: sv-app-4242

services:
  app:
    image: codeberg.org/forgejo/forgejo:9
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    
    ports:
      - "127.0.0.1:20101:3000"

    environment:
      FORGEJO__server__ROOT_URL: "https://forgejo.golden.test"

    volumes:
      - sv-app-4242_data:/data


volumes:
  sv-app-4242_data:
    external: true
