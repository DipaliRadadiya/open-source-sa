name: sv-app-4242

services:
  code:
    image: codercom/code-server:4.141.0
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    environment:
      PASSWORD: "212c28e2caa10f22d5da35638d9c0d29"

    volumes:
      - sv-app-4242_home:/home/coder

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  sv-app-4242_home:
    external: true
