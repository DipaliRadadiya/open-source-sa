name: sv-app-4242

services:
  agentzero:
    image: agent0ai/agent-zero:v2.14
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:80"

    environment:
      AUTH_LOGIN: admin
      AUTH_PASSWORD: "353c37ffac5195f7d749a096c9c2fcbe"
      ALLOWED_ORIGINS: "https://agentzero.golden.test"

    volumes:
      - sv-app-4242_data:/a0/usr

volumes:
  sv-app-4242_data:
    external: true
