name: sv-app-4242

services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:3000"

    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: wiki
      DB_USER: wiki
      DB_PASS: 2efe3b750813d1fdf1b99fa67687a572

    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: 2efe3b750813d1fdf1b99fa67687a572

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

volumes:
  sv-app-4242_db:
    external: true
