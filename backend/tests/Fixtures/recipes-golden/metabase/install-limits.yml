name: sv-app-4242

services:
  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: e1fb9cfde8881515563f1e020fc24691

    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: e1fb9cfde8881515563f1e020fc24691

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

volumes:
  sv-app-4242_db:
    external: true
