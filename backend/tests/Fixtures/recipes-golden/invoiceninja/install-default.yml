name: sv-app-4242

services:
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:80"

    volumes:
      - /home/owner/site/public_html/etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - sv-app-4242_public:/var/www/html/public:ro
      - sv-app-4242_storage:/var/www/html/storage:ro

    depends_on:
      app:
        condition: service_healthy

  app:
    image: invoiceninja/invoiceninja-debian:5.13.47
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      APP_URL: "https://invoiceninja.golden.test"
      APP_KEY: "base64:MzliYmJiMjNjNWIyOTg0Mjk1ZGI4N2IwODVkNGJhOWE="
      APP_ENV: production
      APP_DEBUG: "false"
      REQUIRE_HTTPS: "false"
      PHANTOMJS_PDF_GENERATION: "false"
      PDF_GENERATOR: snappdf
      TRUSTED_PROXIES: "*"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: "null"
      REDIS_PORT: "6379"
      FILESYSTEM_DISK: debian_docker
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ninja
      DB_USERNAME: ninja
      DB_PASSWORD: "94e7b38820d2648c352e633090bc6557"
      IN_USER_EMAIL: "owner@golden.test"
      IN_PASSWORD: "0042085af562d4500968b2b19e903fa7"
      MAIL_MAILER: log
      IS_DOCKER: "true"
      SCOUT_DRIVER: "null"

    volumes:
      - sv-app-4242_public:/var/www/html/public
      - sv-app-4242_storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_DATABASE: ninja
      MYSQL_USER: ninja
      MYSQL_PASSWORD: "94e7b38820d2648c352e633090bc6557"
      MYSQL_ROOT_PASSWORD: "58d755285cbfb00459972e61d8f4ae0c"

    volumes:
      - sv-app-4242_db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - sv-app-4242_redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sv-app-4242_public:
    external: true
  sv-app-4242_storage:
    external: true
  sv-app-4242_db:
    external: true
  sv-app-4242_redis:
    external: true
