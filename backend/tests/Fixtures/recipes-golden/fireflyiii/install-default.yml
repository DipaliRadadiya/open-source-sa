name: sv-app-4242

services:
  app:
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    environment:
      APP_URL: "https://fireflyiii.golden.test"
      APP_KEY: "9b317e2be403257b7d2c3d96e65998de"
      APP_ENV: production
      APP_DEBUG: "false"
      TZ: UTC
      TRUSTED_PROXIES: "**"
      LOG_CHANNEL: stdout
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: "c32123cea03854cdc46825268926befa"
      MAIL_MAILER: log
      STATIC_CRON_TOKEN: "007e7577ef9b02842f58ded9b2b39a6f"

    volumes:
      - sv-app-4242_upload:/var/www/html/storage/upload

    depends_on:
      db:
        condition: service_healthy

  cron:
    image: alpine:3.24.2
    restart: unless-stopped
    mem_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command:
      - sh
      - -c
      - 'while :; do sleep 3600; { printf "GET /api/v1/cron/%s HTTP/1.0\r\nHost: app\r\n\r\n" "$$STATIC_CRON_TOKEN"; sleep 300; } | nc -w 300 app 8080 > /dev/null 2>&1; sleep 82500; done'

    environment:
      STATIC_CRON_TOKEN: "007e7577ef9b02842f58ded9b2b39a6f"

    depends_on:
      app:
        condition: service_started

  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: "c32123cea03854cdc46825268926befa"
      MYSQL_ROOT_PASSWORD: "266483c1f680b0f2f6b5368473fa96e4"

    volumes:
      - sv-app-4242_db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  sv-app-4242_upload:
    external: true
  sv-app-4242_db:
    external: true
