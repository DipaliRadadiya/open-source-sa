name: sv-app-4242

services:
  proxy:
    image: makeplane/plane-proxy:v1.4.2
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:80"

    environment:
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads

    depends_on:
      - web
      - space
      - admin
      - live
      - api

  web:
    image: makeplane/plane-frontend:v1.4.2
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - api
      - worker

  space:
    image: makeplane/plane-space:v1.4.2
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - api
      - worker
      - web

  admin:
    image: makeplane/plane-admin:v1.4.2
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:v1.4.2
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: "8fcbe712e0abc523668e5fb1d5fccc93"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/

    depends_on:
      - api
      - web

  api:
    image: makeplane/plane-backend:v1.4.2
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["sh", "-c", "./bin/docker-entrypoint-migrator.sh && exec ./bin/docker-entrypoint-api.sh"]

    environment:
      WEB_URL: "https://plane.golden.test"
      CORS_ALLOWED_ORIGINS: "https://plane.golden.test"
      APP_DOMAIN: "plane.golden.test"
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      SECRET_KEY: "45f8246170178af7652447eea3594807"
      LIVE_SERVER_SECRET_KEY: "8fcbe712e0abc523668e5fb1d5fccc93"
      API_KEY_RATE_LIMIT: 60/minute
      DATABASE_URL: "postgresql://plane:7641f1eda19641057908d77ff57d6e69@plane-db:5432/plane"
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "7641f1eda19641057908d77ff57d6e69"
      POSTGRES_DB: plane
      POSTGRES_PORT: "5432"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      AMQP_URL: "amqp://plane:72b223880645a777ab2dfed1d5db297f@plane-mq:5672/plane"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: plane
      AWS_SECRET_ACCESS_KEY: "48f3a5c5a0eb60a0dd27675c0c9b01c9"
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"

    volumes:
      - sv-app-4242_api-logs:/code/plane/logs

    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s

  worker:
    image: makeplane/plane-backend:v1.4.2
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ./bin/docker-entrypoint-worker.sh

    environment:
      WEB_URL: "https://plane.golden.test"
      CORS_ALLOWED_ORIGINS: "https://plane.golden.test"
      APP_DOMAIN: "plane.golden.test"
      DEBUG: "0"
      SECRET_KEY: "45f8246170178af7652447eea3594807"
      LIVE_SERVER_SECRET_KEY: "8fcbe712e0abc523668e5fb1d5fccc93"
      DATABASE_URL: "postgresql://plane:7641f1eda19641057908d77ff57d6e69@plane-db:5432/plane"
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "7641f1eda19641057908d77ff57d6e69"
      POSTGRES_DB: plane
      POSTGRES_PORT: "5432"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      AMQP_URL: "amqp://plane:72b223880645a777ab2dfed1d5db297f@plane-mq:5672/plane"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: plane
      AWS_SECRET_ACCESS_KEY: "48f3a5c5a0eb60a0dd27675c0c9b01c9"
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"

    volumes:
      - sv-app-4242_worker-logs:/code/plane/logs

    depends_on:
      - api

  beat-worker:
    image: makeplane/plane-backend:v1.4.2
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ./bin/docker-entrypoint-beat.sh

    environment:
      WEB_URL: "https://plane.golden.test"
      CORS_ALLOWED_ORIGINS: "https://plane.golden.test"
      APP_DOMAIN: "plane.golden.test"
      DEBUG: "0"
      SECRET_KEY: "45f8246170178af7652447eea3594807"
      LIVE_SERVER_SECRET_KEY: "8fcbe712e0abc523668e5fb1d5fccc93"
      DATABASE_URL: "postgresql://plane:7641f1eda19641057908d77ff57d6e69@plane-db:5432/plane"
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "7641f1eda19641057908d77ff57d6e69"
      POSTGRES_DB: plane
      POSTGRES_PORT: "5432"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      AMQP_URL: "amqp://plane:72b223880645a777ab2dfed1d5db297f@plane-mq:5672/plane"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: plane
      AWS_SECRET_ACCESS_KEY: "48f3a5c5a0eb60a0dd27675c0c9b01c9"
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"

    volumes:
      - sv-app-4242_beat-logs:/code/plane/logs

    depends_on:
      - api

  plane-db:
    image: postgres:15.19-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["postgres", "-c", "max_connections=1000"]

    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "7641f1eda19641057908d77ff57d6e69"
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plane", "-d", "plane"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  plane-redis:
    image: valkey/valkey:7.2.14-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - sv-app-4242_redis:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  plane-mq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    hostname: plane-mq

    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: "72b223880645a777ab2dfed1d5db297f"
      RABBITMQ_DEFAULT_VHOST: plane

    volumes:
      - sv-app-4242_mq:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  plane-minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["server", "/data", "--console-address", ":9090"]

    environment:
      MINIO_ROOT_USER: plane
      MINIO_ROOT_PASSWORD: "48f3a5c5a0eb60a0dd27675c0c9b01c9"

    volumes:
      - sv-app-4242_uploads:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sv-app-4242_api-logs:
    external: true
  sv-app-4242_worker-logs:
    external: true
  sv-app-4242_beat-logs:
    external: true
  sv-app-4242_db:
    external: true
  sv-app-4242_redis:
    external: true
  sv-app-4242_mq:
    external: true
  sv-app-4242_uploads:
    external: true
