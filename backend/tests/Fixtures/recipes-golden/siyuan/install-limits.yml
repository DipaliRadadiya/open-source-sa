name: sv-app-4242

services:
  siyuan:
    image: b3log/siyuan:v3.8.6
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:6806"

    command: ["serve"]
    environment:
      SIYUAN_WORKSPACE_PATH: /siyuan/workspace
      SIYUAN_ACCESS_AUTH_CODE: "dc7ec70f866edfe4e4cd4c372bd84905"
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC

    volumes:
      - sv-app-4242_workspace:/siyuan/workspace

volumes:
  sv-app-4242_workspace:
    external: true
