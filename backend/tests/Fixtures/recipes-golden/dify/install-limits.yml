name: sv-app-4242

services:
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:80"

    volumes:
      - /home/owner/site/public_html/etc/nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      - api
      - web

  api:
    image: langgenius/dify-api:1.17.1
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    user: root
    entrypoint: ["/bin/bash", "-c", "chown 1001:1001 /app/api/storage && exec setpriv --reuid=1001 --regid=1001 --init-groups /bin/bash /entrypoint.sh"]

    environment:
      MODE: api
      SECRET_KEY: "7bb05a9ddb50a6fcf062d48e9d7c36a0"
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      MIGRATION_ENABLED: "true"
      CONSOLE_API_URL: ""
      CONSOLE_WEB_URL: ""
      SERVICE_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: "https://dify.golden.test"
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: "https://dify.golden.test"
      ENDPOINT_URL_TEMPLATE: "https://dify.golden.test/e/{hook_id}"
      RESPECT_XFORWARD_HEADERS_ENABLED: "true"
      ENABLE_COLLABORATION_MODE: "false"
      WEB_API_CORS_ALLOW_ORIGINS: "*"
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "e3becea46a4f983b8a80579011dcfbd7"
      REDIS_DB: "0"
      CELERY_BROKER_URL: "redis://:e3becea46a4f983b8a80579011dcfbd7@redis:6379/1"
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      PGVECTOR_DATABASE: dify
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: "f0ffb94ad92f80bf274d368da39c7698"
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: "a9d5878f35a6f31c0e5c2741b874ea36"
      INNER_API_KEY_FOR_PLUGIN: "44a4b7d41caf4c83659097176a94b733"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      MARKETPLACE_ENABLED: "true"
      MARKETPLACE_API_URL: https://marketplace.dify.ai

    volumes:
      - sv-app-4242_storage:/app/api/storage

    networks:
      - ssrf_proxy_network
      - default

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  worker:
    image: langgenius/dify-api:1.17.1
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MODE: worker
      SECRET_KEY: "7bb05a9ddb50a6fcf062d48e9d7c36a0"
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      MIGRATION_ENABLED: "true"
      CONSOLE_API_URL: ""
      CONSOLE_WEB_URL: ""
      SERVICE_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: "https://dify.golden.test"
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: "https://dify.golden.test"
      ENDPOINT_URL_TEMPLATE: "https://dify.golden.test/e/{hook_id}"
      CELERY_WORKER_AMOUNT: "4"
      ENABLE_COLLABORATION_MODE: "false"
      WEB_API_CORS_ALLOW_ORIGINS: "*"
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "e3becea46a4f983b8a80579011dcfbd7"
      REDIS_DB: "0"
      CELERY_BROKER_URL: "redis://:e3becea46a4f983b8a80579011dcfbd7@redis:6379/1"
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      PGVECTOR_DATABASE: dify
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: "f0ffb94ad92f80bf274d368da39c7698"
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: "a9d5878f35a6f31c0e5c2741b874ea36"
      INNER_API_KEY_FOR_PLUGIN: "44a4b7d41caf4c83659097176a94b733"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      MARKETPLACE_ENABLED: "true"
      MARKETPLACE_API_URL: https://marketplace.dify.ai

    volumes:
      - sv-app-4242_storage:/app/api/storage

    networks:
      - ssrf_proxy_network
      - default

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  worker_beat:
    image: langgenius/dify-api:1.17.1
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MODE: beat
      SECRET_KEY: "7bb05a9ddb50a6fcf062d48e9d7c36a0"
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      MIGRATION_ENABLED: "true"
      CONSOLE_API_URL: ""
      CONSOLE_WEB_URL: ""
      SERVICE_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: "https://dify.golden.test"
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: "https://dify.golden.test"
      ENDPOINT_URL_TEMPLATE: "https://dify.golden.test/e/{hook_id}"
      ENABLE_COLLABORATION_MODE: "false"
      WEB_API_CORS_ALLOW_ORIGINS: "*"
      CONSOLE_CORS_ALLOW_ORIGINS: "*"
      DB_TYPE: postgresql
      DB_USERNAME: postgres
      DB_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "e3becea46a4f983b8a80579011dcfbd7"
      REDIS_DB: "0"
      CELERY_BROKER_URL: "redis://:e3becea46a4f983b8a80579011dcfbd7@redis:6379/1"
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      PGVECTOR_DATABASE: dify
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: "f0ffb94ad92f80bf274d368da39c7698"
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: "a9d5878f35a6f31c0e5c2741b874ea36"
      INNER_API_KEY_FOR_PLUGIN: "44a4b7d41caf4c83659097176a94b733"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      MARKETPLACE_ENABLED: "true"
      MARKETPLACE_API_URL: https://marketplace.dify.ai

    networks:
      - ssrf_proxy_network
      - default

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: langgenius/dify-web:1.17.1
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: http://api:5001
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      TEXT_GENERATION_TIMEOUT_MS: "60000"
      CSP_WHITELIST: ""
      ALLOW_EMBED: "false"
      TOP_K_MAX_VALUE: "10"
      INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "4000"
      LOOP_NODE_MAX_COUNT: "100"
      MAX_TOOLS_NUM: "10"
      MAX_PARALLEL_LIMIT: "10"
      MAX_ITERATIONS_NUM: "99"
      MAX_TREE_DEPTH: "50"

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      API_KEY: "f0ffb94ad92f80bf274d368da39c7698"
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: "8194"

    volumes:
      - sv-app-4242_sandbox-deps:/dependencies
      - /home/owner/site/public_html/conf:/conf

    networks:
      - ssrf_proxy_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "e3becea46a4f983b8a80579011dcfbd7"
      SERVER_PORT: "5002"
      SERVER_KEY: "a9d5878f35a6f31c0e5c2741b874ea36"
      MAX_PLUGIN_PACKAGE_SIZE: "52428800"
      PPROF_ENABLED: "false"
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: "44a4b7d41caf4c83659097176a94b733"
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "true"
      PYTHON_ENV_INIT_TIMEOUT: "120"
      PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets

    volumes:
      - sv-app-4242_plugins:/app/storage

    networks:
      - ssrf_proxy_network
      - default

    depends_on:
      db:
        condition: service_healthy

  ssrf_proxy:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["-f", "/etc/squid/dify/squid.conf", "-NYC"]

    volumes:
      - /home/owner/site/public_html/etc/squid/dify:/etc/squid/dify:ro

    networks:
      - ssrf_proxy_network
      - default

  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "63e6aa725127a6cb7f0707a7261f1d16"
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata

    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "effective_cache_size=4096MB"]

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "dify"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:6.2.24-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      REDISCLI_AUTH: "e3becea46a4f983b8a80579011dcfbd7"

    command: ["redis-server", "--requirepass", "e3becea46a4f983b8a80579011dcfbd7"]

    volumes:
      - sv-app-4242_redis:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true

volumes:
  sv-app-4242_storage:
    external: true
  sv-app-4242_plugins:
    external: true
  sv-app-4242_sandbox-deps:
    external: true
  sv-app-4242_db:
    external: true
  sv-app-4242_redis:
    external: true
