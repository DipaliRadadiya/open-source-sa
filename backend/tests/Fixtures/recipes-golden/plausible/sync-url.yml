name: sv-app-4242

services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"

    ports:
      - "127.0.0.1:20101:8000"

    environment:
      BASE_URL: "http://plausible.golden.test"
      SECRET_KEY_BASE: "2ae49deb790a2c74d5a8ffcace1aa9938fb47b08c4c36db7dfb9b973ffa3fb78"
      TOTP_VAULT_KEY: "ODEyNThkZTAzMjFhNTAyNWIyYjM5OGRmZWJjYjhhOGQ="
      DISABLE_REGISTRATION: invite_only
      HTTP_PORT: "8000"
      DATABASE_URL: "postgres://plausible:b7a3a5b699c566637609d6250a3f7f6b@db:5432/plausible_db"
      CLICKHOUSE_DATABASE_URL: http://events_db:8123/plausible_events_db
      TMPDIR: /var/lib/plausible/tmp

    volumes:
      - sv-app-4242_data:/var/lib/plausible

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      db:
        condition: service_healthy
      events_db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: plausible_db
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: "b7a3a5b699c566637609d6250a3f7f6b"

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plausible", "-d", "plausible_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 1m

  events_db:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"

    volumes:
      - sv-app-4242_events:/var/lib/clickhouse
      - sv-app-4242_events-logs:/var/log/clickhouse-server
      - /home/owner/golden-plausible/public_html/public_html/etc/clickhouse-server/config.d:/etc/clickhouse-server/config.d:ro
      - /home/owner/golden-plausible/public_html/public_html/etc/clickhouse-server/users.d:/etc/clickhouse-server/users.d:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 1m

volumes:
  sv-app-4242_data:
    external: true
  sv-app-4242_db:
    external: true
  sv-app-4242_events:
    external: true
  sv-app-4242_events-logs:
    external: true
