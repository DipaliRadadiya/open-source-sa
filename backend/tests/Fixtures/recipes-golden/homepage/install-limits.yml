name: sv-app-4242

services:
  app:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    
    ports:
      - "127.0.0.1:20101:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.golden.test"

    volumes:
      - sv-app-4242_config:/app/config


volumes:
  sv-app-4242_config:
    external: true
