name: sv-app-4242

services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:3000"

    environment:
      NEXTAUTH_URL: "http://karakeep.golden.test"
      NEXTAUTH_SECRET: "b88c811219d34fcf827ca0d86f0da97c"
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: "e93c02b31b34170ab152bce61d98e1b8"
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      DB_WAL_MODE: "true"
      DISABLE_SIGNUPS: "false"

    volumes:
      - sv-app-4242_data:/data

    depends_on:
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1
    init: true
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: "e93c02b31b34170ab152bce61d98e1b8"
      MEILI_NO_ANALYTICS: "true"

    volumes:
      - sv-app-4242_meili:/meili_data

volumes:
  sv-app-4242_data:
    external: true
  sv-app-4242_meili:
    external: true
