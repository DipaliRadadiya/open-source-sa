name: sv-app-4242

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.0-slim
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    environment:
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: "a56e06f5176f09c8b17a260e33912907"
      WEBUI_ADMIN_EMAIL: "owner@golden.test"
      WEBUI_ADMIN_PASSWORD: "cba44bf01995db36238464f42b902f55"
      WEBUI_ADMIN_NAME: Admin
      WEBUI_URL: "http://openwebui.golden.test"

    volumes:
      - sv-app-4242_data:/app/backend/data

volumes:
  sv-app-4242_data:
    external: true
