name: sv-app-4242

services:
  docmost:
    image: docmost/docmost:0.96.0
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:3000"

    environment:
      APP_URL: "http://docmost.golden.test"
      APP_SECRET: "e034051f04b14da3341ebe46636b9b17"
      DATABASE_URL: "postgresql://docmost:b31f06dbe5d86a193c9a36968192a91c@db:5432/docmost"
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      DISABLE_TELEMETRY: "true"

    volumes:
      - sv-app-4242_storage:/app/data/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "b31f06dbe5d86a193c9a36968192a91c"

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "docmost", "-d", "docmost"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]

    volumes:
      - sv-app-4242_redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sv-app-4242_storage:
    external: true
  sv-app-4242_db:
    external: true
  sv-app-4242_redis:
    external: true
