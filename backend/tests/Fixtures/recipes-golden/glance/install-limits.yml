name: sv-app-4242

services:
  app:
    image: glanceapp/glance:latest
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    
    ports:
      - "127.0.0.1:20101:8080"

    volumes:
      - /home/owner/site/public_html/app/config:/app/config
