name: sv-app-4242

services:
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    
    ports:
      - "127.0.0.1:20101:2368"

    environment:
      
      url: https://ghost.golden.test
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ab1755c2dd7b9e209791ddd46d3c518b
      database__connection__database: ghost

    volumes:
      - sv-app-4242_content:/var/lib/ghost/content

    
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    
    environment:
      MYSQL_ROOT_PASSWORD: f54cb7d4eea4e5fa2e2b1d98d6bf411e
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ab1755c2dd7b9e209791ddd46d3c518b

    volumes:
      - sv-app-4242_db:/var/lib/mysql

volumes:
  sv-app-4242_content:
    external: true
  sv-app-4242_db:
    external: true
