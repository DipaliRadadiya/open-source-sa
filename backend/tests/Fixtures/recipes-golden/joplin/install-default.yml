name: sv-app-4242

services:
  joplin:
    image: joplin/server:3.7.2
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:22300"

    environment:
      APP_BASE_URL: "https://joplin.golden.test"
      APP_PORT: "22300"
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: "c55cfe48e05bb94df5a1a1b1d2012aea"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:22300,path:'/api/ping',headers:{Host:'joplin.golden.test'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: "c55cfe48e05bb94df5a1a1b1d2012aea"

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "joplin", "-d", "joplin"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sv-app-4242_db:
    external: true
