name: sv-app-4242

services:
  trilium:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      TZ: Etc/UTC

    volumes:
      - sv-app-4242_data:/home/node/trilium-data

volumes:
  sv-app-4242_data:
    external: true
