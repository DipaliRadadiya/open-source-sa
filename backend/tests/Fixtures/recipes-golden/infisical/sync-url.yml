name: sv-app-4242

services:
  infisical:
    image: infisical/infisical:v0.166.4
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8080"

    command: ["sh", "-c", "export ENCRYPTION_KEY=$$(printf %s $$ENCRYPTION_KEY_SEED | sha256sum | cut -c1-32) && unset ENCRYPTION_KEY_SEED && exec ./standalone-entrypoint.sh"]
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY_SEED: "4fac9652f40dbdfafb9a651382aa1e2d"
      AUTH_SECRET: "YjhjMGVkZmJjYTNkYjM0NTdiZjMyZGZlODM1ZDVmMmU="
      DB_CONNECTION_URI: "postgres://infisical:5900c8e0e8337fcd2e8b9b8616ecd107@db:5432/infisical"
      REDIS_URL: redis://redis:6379
      SITE_URL: "http://infisical.golden.test"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: "5900c8e0e8337fcd2e8b9b8616ecd107"

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - sv-app-4242_redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  sv-app-4242_db:
    external: true
  sv-app-4242_redis:
    external: true
