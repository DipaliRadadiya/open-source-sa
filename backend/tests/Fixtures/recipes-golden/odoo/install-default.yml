name: sv-app-4242

services:
  odoo:
    image: odoo:19.0-20260926
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:8069"

    environment:
      HOST: db
      USER: odoo
      PASSWORD: "30c97f2ee3b138f5e34422e703ccd7d7"
      MASTER_PASSWORD: "da97533134548cf9342b20c1c350f178"
      ODOO_RC: /var/lib/odoo/odoo.conf

    command:
      - /bin/sh
      - -ec
      - |
        python3 - <<'PY'
        import configparser
        import os
        import tempfile

        path = os.environ['ODOO_RC']
        config = configparser.ConfigParser(interpolation=None)
        source = path if os.path.exists(path) else '/etc/odoo/odoo.conf'
        with open(source, encoding='utf-8') as stream:
            config.read_file(stream)
        config.set('options', 'admin_passwd', os.environ['MASTER_PASSWORD'])
        fd, temporary = tempfile.mkstemp(prefix='.odoo-conf-', dir=os.path.dirname(path))
        try:
            with os.fdopen(fd, 'w', encoding='utf-8') as stream:
                config.write(stream)
            os.replace(temporary, path)
        finally:
            if os.path.exists(temporary):
                os.unlink(temporary)
        PY
        exec /entrypoint.sh odoo -c "$$ODOO_RC" --proxy-mode --without-demo --workers=0 --http-port=8069

    volumes:
      - sv-app-4242_data:/var/lib/odoo

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "30c97f2ee3b138f5e34422e703ccd7d7"

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sv-app-4242_data:
    external: true
  sv-app-4242_db:
    external: true
