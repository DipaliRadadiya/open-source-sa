name: sv-app-4242

services:
  server:
    image: twentycrm/twenty:v2.46.0@sha256:bb4e94f0215cbd14c7356b0324d9b7ac10ccd077042cd6d5058ad02ef2080605
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:20101:3000"

    environment:
      NODE_PORT: "3000"
      SERVER_URL: "http://twenty.golden.test"
      PG_DATABASE_URL: "postgres://postgres:20abf4b33da8c27d417e817e82abeab5@db:5432/default"
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: local
      APP_SECRET: "a798c051d4a00c73b24931a1f2e84e1f"
      ENCRYPTION_KEY: "71445991bf41c6555e1ff8f2f23abe49"
      IS_MULTIWORKSPACE_ENABLED: "false"

    volumes:
      - sv-app-4242_server-local-data:/app/packages/twenty-server/.local-storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: twentycrm/twenty:v2.46.0@sha256:bb4e94f0215cbd14c7356b0324d9b7ac10ccd077042cd6d5058ad02ef2080605
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["yarn", "worker:prod"]
    environment:
      SERVER_URL: "http://twenty.golden.test"
      PG_DATABASE_URL: "postgres://postgres:20abf4b33da8c27d417e817e82abeab5@db:5432/default"
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
      APP_SECRET: "a798c051d4a00c73b24931a1f2e84e1f"
      ENCRYPTION_KEY: "71445991bf41c6555e1ff8f2f23abe49"
      IS_MULTIWORKSPACE_ENABLED: "false"

    volumes:
      - sv-app-4242_server-local-data:/app/packages/twenty-server/.local-storage

    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: "20abf4b33da8c27d417e817e82abeab5"
      POSTGRES_USER: postgres

    volumes:
      - sv-app-4242_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.2@sha256:4521b581dbddea6e7d81f8fe95ede93f5648aaa66a9dacd581611bf6fe7527bd
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sv-app-4242_server-local-data:
    external: true
  sv-app-4242_db:
    external: true
